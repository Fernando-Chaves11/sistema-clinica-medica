{% extends 'base.html' %}

{% block conteudo %}

<div class="card shadow p-4">

<h2 class="text-center mb-4">

✏️ Editar Paciente

</h2>

<form action="/atualizar/{{ paciente.id }}" method="POST">

<div class="mb-3">

<label>Nome</label>

<input
type="text"
name="nome"
class="form-control"
value="{{ paciente.nome }}"
required>

</div>

<div class="mb-3">

<label>CPF</label>

<input
type="text"
name="cpf"
class="form-control"
value="{{ paciente.cpf }}"
required>

</div>

<div class="mb-3">

<label>Telefone</label>

<input
type="text"
name="telefone"
class="form-control"
value="{{ paciente.telefone }}">

</div>

<div class="mb-3">

<label>Data de Nascimento</label>

<input
type="date"
name="nascimento"
class="form-control"
value="{{ paciente.nascimento }}">

</div>

<button class="btn btn-success">

Salvar Alterações

</button>

<a href="/pacientes" class="btn btn-secondary">

Cancelar

</a>

</form>

</div>

{% endblock %}
