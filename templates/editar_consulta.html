{% extends 'base.html' %}

{% block conteudo %}

<div class="card shadow p-4">

<h2 class="text-center mb-4">

📅 Editar Consulta

</h2>

<form action="/atualizar_consulta/{{ consulta.id }}" method="POST">

<div class="mb-3">

<label>Paciente</label>

<select name="paciente" class="form-control">

{% for paciente in pacientes %}

<option value="{{ paciente.nome }}"
{% if paciente.nome == consulta.paciente %}selected{% endif %}>

{{ paciente.nome }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Médico</label>

<select name="medico" class="form-control">

{% for medico in medicos %}

<option value="{{ medico.nome }}"
{% if medico.nome == consulta.medico %}selected{% endif %}>

{{ medico.nome }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Data</label>

<input
type="date"
name="data"
class="form-control"
value="{{ consulta.data }}">

</div>

<div class="mb-3">

<label>Hora</label>

<input
type="time"
name="hora"
class="form-control"
value="{{ consulta.hora }}">

</div>

<div class="mb-3">

<label>Observação</label>

<input
type="text"
name="observacao"
class="form-control"
value="{{ consulta.observacao }}">

</div>

<button class="btn btn-success">

Salvar Alterações

</button>

<a href="/consultas" class="btn btn-secondary">

Cancelar

</a>

</form>

</div>

{% endblock %}
